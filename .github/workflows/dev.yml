name: Build and validate packages

on:
  workflow_call:
    inputs:
      package_version:
        description: Version stamped into every unsigned extension manifest
        required: false
        type: string
        default: v0.0.0-dev
    outputs:
      release_metadata_artifact_id:
        description: Immutable release-metadata artifact ID
        value: ${{ jobs.packages.outputs.release_metadata_artifact_id }}
      release_metadata_artifact_digest:
        description: SHA-256 digest of the uploaded release-metadata artifact
        value: ${{ jobs.packages.outputs.release_metadata_artifact_digest }}
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Build 51 unsigned packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      release_metadata_artifact_id: ${{ steps.upload_release_metadata.outputs.artifact-id }}
      release_metadata_artifact_digest: ${{ steps.upload_release_metadata.outputs.artifact-digest }}
    env:
      ARMORY_INDEX_PUBLIC_KEY: RWSBpxpRWDrD7Fe+VvRE3c2VEDC2NK80rlNCj+BX0gz44Xw07r6KQD9L
      PACKAGE_REPO_URL: https://github.com/sliverarmory/CS-Remote-OPs-BOF
      PACKAGE_VERSION: ${{ inputs.package_version || 'v0.0.0-dev' }}
      SLIVER_COMMIT: ccebd505b016e393f6b622a7f2968c02dd3972e1
    steps:
      - name: Check out package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n make_bof.sh scripts/build_all_packages.sh scripts/check_restored_objects.sh scripts/verify_actions_artifact.sh scripts/verify_release_metadata.sh tests/run_safety_tests.sh
          python3 -m py_compile scripts/check_release_inventory.py scripts/check_release_version.py
          python3 tests/archive_format_test.py
          python3 tests/lastpass_parser_test.py
          python3 tests/release_version_test.py
          tests/run_safety_tests.sh
          LC_ALL=C sort -c armory-package-executors.txt
          LC_ALL=C sort -c armory-package-inventory.txt
          test "$(wc -l < armory-package-executors.txt)" -eq 51
          test "$(wc -l < armory-package-inventory.txt)" -eq 51
          for manifest in src/Remote/*/extension.json src/Injection/*/extension.json; do
            jq -e . "$manifest" >/dev/null
          done

      - name: Install index verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes minisign jq

      - name: Verify and freeze latest signed Armory index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/release-metadata"
          mkdir -p "$metadata_dir"
          cp armory-package-executors.txt armory-package-inventory.txt "$metadata_dir/"

          latest_json=$(gh api repos/sliverarmory/armory/releases/latest)
          index_release_tag=$(jq -er '.tag_name' <<<"$latest_json")
          if [[ ! "$index_release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: latest Armory index tag is not strict semver: $index_release_tag" >&2
            exit 1
          fi
          gh release download "$index_release_tag" \
            --repo sliverarmory/armory \
            --pattern armory.json \
            --pattern armory.minisig \
            --dir "$metadata_dir"
          minisign -Vm "$metadata_dir/armory.json" \
            -x "$metadata_dir/armory.minisig" \
            -P "$ARMORY_INDEX_PUBLIC_KEY"
          latest_after=$(gh api repos/sliverarmory/armory/releases/latest --jq .tag_name)
          if [[ "$latest_after" != "$index_release_tag" ]]; then
            echo "ERROR: latest Armory index changed while it was being verified" >&2
            exit 1
          fi

          package_public_key=$(jq -er --arg repo "$PACKAGE_REPO_URL" '
            [((.aliases // []) + (.extensions // []))[]
              | select((.repo_url | ascii_downcase | rtrimstr("/") | rtrimstr(".git")) == ($repo | ascii_downcase))] as $entries
            | ($entries | map(.command_name) | unique) as $names
            | ($entries | map(.public_key) | unique) as $keys
            | if ($entries | length) == 47
                and ($names | length) == 47
                and ($keys | length) == 1
              then $keys[0]
              else error("unexpected signed-index sibling count, identity, or package key")
              end
          ' "$metadata_dir/armory.json")
          printf '%s\n' "$ARMORY_INDEX_PUBLIC_KEY" > "$metadata_dir/armory-index-public-key.txt"
          printf '%s\n' "$package_public_key" > "$metadata_dir/package-public-key.txt"
          git rev-parse HEAD > "$metadata_dir/package-source-commit.txt"
          printf '%s\n' "$index_release_tag" > "$metadata_dir/armory-release-tag.txt"
          (
            cd "$metadata_dir"
            sha256sum \
              armory-index-public-key.txt \
              armory-package-executors.txt \
              armory-package-inventory.txt \
              armory-release-tag.txt \
              armory.json \
              armory.minisig \
              package-public-key.txt \
              package-source-commit.txt > SHA256SUMS
          )
          EXPECTED_INDEX_RELEASE_TAG="$index_release_tag" \
            scripts/verify_release_metadata.sh "$metadata_dir" >/dev/null

      - name: Build every canonical package
        shell: bash
        run: |
          set -euo pipefail
          host_uid=$(id -u)
          host_gid=$(id -g)
          docker run --rm \
            --platform linux/amd64 \
            --entrypoint /bin/bash \
            --env HOST_UID="$host_uid" \
            --env HOST_GID="$host_gid" \
            --env PACKAGE_VERSION="$PACKAGE_VERSION" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            freefirex2/ts_bof_builder@sha256:e203ba628c97abb51ef65914b216fa1e088401710107027c353d15f09e0cfb62 \
            -lc 'set -euo pipefail; dnf install -y coreutils diffutils jq; ./scripts/build_all_packages.sh; chown -R "$HOST_UID:$HOST_GID" packages Remote Injection src'

      - name: Validate archive and signed-index inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_release_inventory.py \
            --inventory armory-package-inventory.txt \
            --executors armory-package-executors.txt \
            --packages-dir packages \
            --repo-url "$PACKAGE_REPO_URL" \
            --tag "$PACKAGE_VERSION" \
            --index "$RUNNER_TEMP/release-metadata/armory.json"

      - name: Check Sliver argument packing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BishopFox/sliver
          ref: ${{ env.SLIVER_COMMIT }}
          path: .sliver-abi
          persist-credentials: false

      - name: Set up Sliver Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .sliver-abi/go.mod
          cache: false

      - name: Exercise real Sliver manifest packing
        shell: bash
        run: |
          set -euo pipefail
          cp tests/sliver_abi_test.go .sliver-abi/client/command/extensions/cs_remote_ops_abi_test.go
          cp tests/sliver_archive_test.go .sliver-abi/client/command/extensions/cs_remote_ops_archive_test.go
          cd .sliver-abi
          # This is a focused external-checkout integration test. The final
          # local release validation also runs Sliver's ./go-tests.sh wrapper.
          CS_REMOTE_OPS_REPO="$GITHUB_WORKSPACE" GOFLAGS=-mod=vendor \
            go test -tags=client,osusergo,netgo,go_sqlite ./client/command/extensions \
              -run '^TestCSRemoteOps(PackedABI|ArchivesInstallable)$' -count=1

      - name: Upload unsigned package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-bof-packages
          path: packages/*.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload verified release metadata
        id: upload_release_metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/*
          if-no-files-found: error
          retention-days: 3

  reflektor-loader:
    name: Reflektor loader windows/${{ matrix.goarch }}
    needs: packages
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - "386"
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      SLIVER_COMMIT: ccebd505b016e393f6b622a7f2968c02dd3972e1
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact unsigned package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-bof-packages
          path: packages

      - name: Check out pinned Sliver executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BishopFox/sliver
          ref: ${{ env.SLIVER_COMMIT }}
          path: .sliver-reflektor
          persist-credentials: false

      - name: Set up Sliver Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .sliver-reflektor/go.mod
          cache: false

      - name: Load and relocate every native BOF without execution
        shell: bash
        run: |
          set -euo pipefail
          cp tests/reflektor_loader_test.go \
            .sliver-reflektor/implant/sliver/handlers/cs_remote_ops_reflektor_test.go
          cd .sliver-reflektor
          CS_REMOTE_OPS_REPO="$GITHUB_WORKSPACE" GOFLAGS=-mod=vendor \
            go test ./implant/sliver/handlers \
              -run '^TestCSRemoteOpsReflektorLoaderCompatibility$' \
              -count=1 -v -timeout 20m 2>&1 \
            | tee "../reflektor-loader-windows-${GOARCH}.log"

      - name: Upload Reflektor loader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflektor-loader-windows-${{ matrix.goarch }}
          path: reflektor-loader-windows-${{ matrix.goarch }}.log
          if-no-files-found: warn
          retention-days: 14
